<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Beach tennis · Tournoi</title>
<style>
:root{--bg:#EAF3F2;--surface:#FFFFFF;--ink:#0A2E38;--muted:#58747C;--line:#CFE0DF;--soft:#DCEBEA;--primary:#0A5566;--on-primary:#FFFFFF;--accent:#FFC21A;--on-accent:#2B2100;--live:#D9482B;--ok:#16794C;--shadow:0 1px 0 rgba(10,46,56,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061A1F;--surface:#0D2A32;--ink:#E5F2F2;--muted:#8FB1B8;--line:#1B4550;--soft:#12363F;--primary:#47BBD2;--on-primary:#03171C;--ok:#4CC58C;--live:#FF7A5E;--shadow:none}}
:root[data-theme="dark"]{--bg:#061A1F;--surface:#0D2A32;--ink:#E5F2F2;--muted:#8FB1B8;--line:#1B4550;--soft:#12363F;--primary:#47BBD2;--on-primary:#03171C;--ok:#4CC58C;--live:#FF7A5E;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.disp{font-family:ui-rounded,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top{padding:16px 16px 6px;max-width:640px;margin:0 auto}
header.top .sub{color:var(--muted);font-size:14px}
header.top h1{font-size:28px;font-weight:800;line-height:1.1;margin:2px 0 4px;overflow-wrap:anywhere}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sw{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:600;cursor:pointer;white-space:nowrap}
.banner{max-width:640px;margin:6px auto 0;padding:0 14px}
.banner div{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
main{max-width:640px;margin:0 auto;padding:8px 14px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:20px;font-weight:800;margin-bottom:4px}
.card h3{font-size:16px;font-weight:600;margin:14px 0 6px}
h4{font-size:15px;font-weight:800;margin:16px 0 6px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 10px}
.note{background:var(--soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1.5px solid var(--primary);background:transparent;color:var(--primary);font-weight:600;cursor:pointer}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.big{width:100%;margin-top:14px;min-height:52px;font-size:17px}
.btn.warn{border-color:var(--live);color:var(--live)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1 1 140px}
input[type=text],input[type=time],input[type=date],input[type=number],input:not([type]),textarea{min-height:46px;width:100%;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
textarea{padding:10px 12px;min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addrow .btn{grid-column:1/-1}
ol.teams{list-style:none;margin:12px 0 0;padding:0}
ol.teams li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.seed{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 13px ui-rounded,system-ui,sans-serif;flex:none}
.tn{flex:1;font-weight:600;overflow-wrap:anywhere}
.tn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tools{display:flex;gap:4px}
.tools button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 56px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
label.lb{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.fmt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}
.fmt.on{border-color:var(--primary);background:var(--soft)}
.fmt .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fmt .top .bd{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fmt b{font:800 18px ui-rounded,system-ui,sans-serif}
.fmt p{margin:6px 0;font-size:14px;color:var(--muted)}
.fmt .why{color:var(--ink);font-weight:500}
.fmt dl{display:flex;gap:16px;margin:8px 0 0;flex-wrap:wrap}
.fmt dt{font-size:12px;color:var(--muted)}
.fmt dd{margin:0;font:800 20px ui-rounded,system-ui,sans-serif}
.badge.ok{background:var(--ok);color:var(--on-primary)}
.badge.warn{background:var(--live);color:var(--on-primary)}
.badge{background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
select{min-height:46px;width:100%;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.addrow select{grid-column:1/-1}
.rk .pt{font-size:13px;color:var(--muted);white-space:nowrap}
.chk{list-style:none;margin:8px 0 0;padding:0}
.chk li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.chk .m{font-weight:800;width:20px;flex:none;text-align:center}
.chk .m.ok{color:var(--ok)}.chk .m.ko{color:var(--live)}.chk .m.in{color:var(--muted)}
.chips{display:flex;gap:6px;margin:8px 0}
.chips button{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot{margin:18px 0 6px;font:800 15px ui-rounded,system-ui,sans-serif;color:var(--muted)}
.match{display:flex;width:100%;text-align:left;gap:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:6px 0;overflow:hidden;cursor:pointer}
.match .when{background:var(--primary);color:var(--on-primary);padding:10px 12px;min-width:84px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.match .when b{font:800 20px ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.match .when span{font-size:12px}
.match.done .when{background:var(--soft);color:var(--ink)}
.match .body{flex:1;padding:8px 12px;min-width:0}
.match .lab{font-size:12px;color:var(--muted)}
.match .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed var(--line)}
.match .row:nth-of-type(1){border-top:0}
.match .row.w{font-weight:800}
.match .row .t{min-width:0;overflow-wrap:anywhere}
.sc{display:flex;gap:6px;font:800 18px ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums}

.ph{color:var(--muted);font-style:italic;font-weight:400}
table.st{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.st th{font-weight:600;color:var(--muted);text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
table.st td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.st td.n,table.st th.n{text-align:left}
table.st tr.q td{font-weight:700}
.rk{list-style:none;margin:8px 0 0;padding:0}
.rk li{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rk .p{font:800 22px ui-rounded,system-ui,sans-serif;width:34px;text-align:center}
.rk li:nth-child(-n+3) .p{color:var(--primary)}
.back{position:fixed;inset:0;background:rgba(3,20,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:20px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 64px 64px 72px;gap:6px;align-items:center;margin:14px 0 6px}
.grid .h{font-size:12px;color:var(--muted);text-align:center}
.grid input{text-align:center;font:800 20px ui-rounded,system-ui,sans-serif;padding:0}
.err{color:var(--live);font-weight:600;font-size:14px;min-height:20px;margin:6px 0}
.lrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lrow.cur .lt b::after{content:' · ouvert';color:var(--primary);font-weight:600;font-size:13px}
.lt{flex:1 1 180px;min-width:0}.lt b{display:block;overflow-wrap:anywhere}.lt small{color:var(--muted);font-size:13px}
.lb2{display:flex;gap:6px;flex-wrap:wrap}
details{margin:12px 0}summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tabs .in{display:flex;gap:4px;width:100%;max-width:640px}
nav.tabs button{flex:1;min-height:52px;border:0;background:transparent;border-radius:10px;font-weight:600;font-size:12.5px;padding:0 2px;color:var(--muted);cursor:pointer;position:relative}
@media (max-width:380px){nav.tabs button{font-size:11.5px}}
.pm{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.brk-wrap{overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.brk{position:relative}
.brk svg{position:absolute;left:0;top:0;pointer-events:none}
.brk svg path{stroke:var(--muted);stroke-width:1.6;fill:none;opacity:.55}
.rh{position:absolute;top:0;font:800 11px ui-rounded,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.bm{position:absolute;display:flex;flex-direction:column;justify-content:center;padding:0;margin:0;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;color:var(--ink)}
.bm.s{position:relative;width:100%;height:auto;margin:4px 0}
.bm.bye{cursor:default;background:var(--bg);border-style:dashed}
.bm.ready{border-color:var(--primary)}
.bm.done{border-left:5px solid var(--primary)}
.bm .bl{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:26px;padding:0 8px;font-size:13px}
.bm .bl+.bl{border-top:1px dashed var(--line)}
.bm .bl.w{font-weight:800}
.bm .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm .sc{font-size:13px;gap:4px}
.bm .sc i{min-width:12px}
.bm .mn{position:absolute;right:6px;top:-1px;font-style:normal;font-size:9px;color:var(--muted)}
.gh{font-size:15px;font-weight:800;margin:14px 0 4px}
.gr{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}
.gc{min-width:220px;flex:1 0 220px}
.gc h5{margin:0 0 4px;font:800 11px ui-rounded,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:8px}
.gg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.gm .gl{display:block;font-size:11px;font-weight:600;margin-top:4px}
nav.tabs button[aria-current=page]{color:var(--on-primary);background:var(--primary)}
nav.tabs .cnt{position:absolute;top:2px;right:8px;background:var(--accent);color:var(--on-accent);font-size:11px;border-radius:99px;padding:0 6px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:800 18px ui-rounded,system-ui,sans-serif;margin-bottom:4px}
pre.share{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.4 ui-monospace,Menlo,monospace;max-height:260px;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>

<header class="top"><div class="hrow"><div class="sub" id="cat"></div><button class="sw" data-act="lib" id="swb"></button></div><h1 id="ttl"></h1><div class="sub" id="sub"></div></header>
<div class="banner" id="ro"></div>

<script>
const KEY='bt-tournoi-v2',MAXT=32,MAXACT=2;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'t'+Math.random().toString(36).slice(2,8);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtD=d=>d?d.split('-').reverse().join('/'):'';

/* ---------- Catégories et formats de jeu FFT ---------- */
const CAT={
  M:{n:'Double messieurs',a:'Joueur 1',b:'Joueur 2',ca:'masculin',cb:'masculin',net:'1,80 m'},
  D:{n:'Double dames',a:'Joueuse 1',b:'Joueuse 2',ca:'féminin',cb:'féminin',net:'1,70 m'},
  X:{n:'Double mixte',a:'Joueur (homme)',b:'Joueuse (dame)',ca:'masculin',cb:'féminin',net:'1,70 m'}};
const FJ={3:{n:4,tb:4,d:'2 sets de 4 jeux, jeu décisif à 4-4, super jeu décisif à 10 points'},
  4:{n:6,tb:6,d:'2 sets de 6 jeux, jeu décisif à 6-6, super jeu décisif à 10 points'},
  5:{n:3,tb:2,d:'2 sets de 3 jeux, jeu décisif à 2-2, super jeu décisif à 10 points'},
  6:{n:4,tb:3,d:'2 sets de 4 jeux, jeu décisif à 3-3, super jeu décisif à 10 points'}};
FJ[0]={n:12,tb:12,d:'1 set de 12 points (format découverte)'};
const validSet=(a,b,f)=>{if(f===0)return Math.max(a,b)===12&&Math.min(a,b)<=11;const {n,tb}=FJ[f],w=Math.max(a,b),l=Math.min(a,b);if(a===b)return false;
  return tb===n?((w===n&&l<=n-2)||(w===n+1&&(l===n-1||l===n))):(w===n&&l<=n-1)};
const forfait=f=>f===0?[[12,0]]:f===4?[[6,0],[6,0]]:f===5?[[3,0],[3,0]]:[[4,0],[4,0]];
const FN=f=>f===0?'Découverte':'Format '+f;
/* Catégories de tournoi BT25 à BT1000 : RS FFT 2027 (art. 210, 225 à 232) et guide de la compétition beach tennis (janvier 2026) */
const BTC={
  BT25:{forms:[0,3,4,5,6],mix:[0,3],fin:'',courts:1,maxDay:5,col:0,cut:{M:600,F:250},floor:0,coef:false,
    jat:'JAT1 minimum',home:'2 semaines avant le premier jour (ADOC)',reg:'au plus tard le jour de la compétition',order:'ordre d\'inscription ou de classement, au choix de l\'organisateur',wc:'pas de wild-card',
    prize:'0 € + lots',days:'1 jour (une demi-journée ou une soirée suffit)',balls:'3 balles par terrain',zone:'zone de 6 m au choix de l\'organisateur',kine:''},
  BT100:{forms:[3,4,5,6],mix:[3],fin:'fin4',courts:1,maxDay:5,col:1,cut:{M:200,F:150},floor:0,coef:false,
    jat:'JAT1 minimum',home:'2 semaines avant le premier jour (ADOC)',reg:'7 jours avant le début',order:'ordre d\'inscription ou de classement, au choix de l\'organisateur',wc:'pas de wild-card',
    prize:'0 € + lots',days:'1 jour',balls:'3 balles par terrain',zone:'zone de 6 m au choix de l\'organisateur',kine:''},
  BT250:{forms:[3,4,5,6],mix:[3],fin:'fin4',courts:2,maxDay:5,col:2,cut:null,floor:120,coef:false,
    jat:'JAT1 minimum (un JAT adjoint si le juge-arbitre joue)',home:'1 mois avant le premier jour (ADOC)',reg:'10 jours avant le début',order:'ordre de classement',wc:'2 wild-cards maximum par tableau, comprises dans l\'effectif',
    prize:'0 à 250 € + lots',days:'1 jour',balls:'3 balles par terrain, 3 par match dès les demi-finales',zone:'zone de 6 m au choix de l\'organisateur',kine:''},
  BT500:{forms:[3,4,5,6],mix:[3,4],fin:'main4',courts:2,maxDay:4,col:3,cut:null,floor:0,coef:true,
    jat:'JAT2 minimum (un JAT adjoint si le juge-arbitre joue)',home:'1 mois avant le premier jour (ADOC)',reg:'10 jours avant le début',order:'ordre de classement obligatoirement',wc:'2 wild-cards maximum par tableau',
    prize:'251 € et plus',days:'1 ou 2 jours (2 jours minimum à partir de 17 paires)',balls:'3 balles par terrain, 3 par match dès les quarts de finale',zone:'zone de 6 m obligatoire pour les messieurs',kine:'conseillé'},
  BT1000:{forms:[3,4,5,6],mix:[],fin:'main4',courts:4,maxDay:4,col:4,cut:null,floor:0,coef:true,
    jat:'JAT3 ou JAT3 BT minimum, non joueur',home:'3 mois avant le premier jour, auprès du service beach tennis de la FFT',reg:'14 jours avant le début',order:'ordre de classement obligatoirement',wc:'2 wild-cards maximum par tableau',
    prize:'750 € et plus',days:'2 jours minimum',balls:'3 balles par match',zone:'zone de 6 m obligatoire pour les messieurs',kine:'obligatoire (un médecin ou un dispositif d\'urgence joignable)'}};
/* Points de classement par rang : colonnes BT25, BT100, BT250, BT500, BT1000 (rang 33 et plus : dernière ligne) */
const PTBT=[[25,100,250,500,1000],[22,75,175,350,700],[21,65,140,270,540],[20,55,105,210,420],[19,47,88,175,350],[18,45,76,150,300],[17,40,65,130,260],[16,35,52,105,210],[15,32,47,95,190],[14,30,43,87,175],[13,28,40,82,165],[12,27,35,75,150],[11,25,33,70,140],[10,24,30,65,130],[9,23,27,60,120],[8,21,23,52,105],[7,20,22,47,95],[6,19,21,45,90],[5,17,20,42,85],[4,16,19,40,80],[3,15,17,37,75],[2,14,16,35,72],[1,13,15,34,70],[1,12,14,33,69],[1,10,13,32,65],[1,9,12,30,64],[1,8,11,29,62],[1,7,10,28,60],[1,6,8,27,57],[1,5,7,25,55],[1,4,6,24,52],[1,3,5,23,50]];
const ptsBT=(rank,n)=>{const r=BTC[S.bt],row=rank<=32?PTBT[rank-1]:[1,2,4,10,20];let v=row[r.col];if(r.coef)v*=(n<=8?.6:n<=12?.7:n<=15?.8:1);return Math.round(v)};

/* ---------- Données : plusieurs tournois ---------- */
function newT(cat,bt){cat=cat||'M';return {id:uid(),name:'Nouveau tournoi',date:'',cat,bt:bt||'BT100',arch:false,teams:[],cfg:{courts:2,dur:{0:15,3:25,4:45,5:20,6:30},start:'09:00',form:cat==='X'?3:4,fmt:null,nc:0,rest:1},g:null,res:{},upd:Date.now()}}

function build(fmt,ids,si){

function standing(p,R){

/* Format de chaque match selon la catégorie : finale ou tableau principal obligatoirement en format 4 (hors double mixte) */
function fOfM(m){const r=BTC[S.bt];let f=S.cfg.form;

/* Repos minimum entre 2 parties (art. 210-4) : 1 h en format 4, 30 min pour les autres formats, 15 min après 3 matchs consécutifs en découverte */
const restOf=f=>{if(!S.cfg.rest)return 0;return f===4?60:f===0?0:30};

      if(x&&y&&x!=='BYE'&&y!=='BYE'){const a=Math.random()<.5;R[m.id]={w:a?'a':'b',sets:a?[[6,0],[6,0]]:[[0,6],[0,6]]};ch=true}})}

const FMT={

  pools:{t:'Poules + phase finale',d:'Poules, puis tableaux de classement : 1ers et 2es de poule en tableau principal, les autres en tableaux de classement. Classement complet.'},

function proposals(){

  G.places.forEach(pl=>{const b0=pl.b0||0;put(b0,pl.base,rs({w:pl.m},R));put(b0,pl.base+1,rs({l:pl.m},R))});
  G.lone.forEach(x=>put(x.b0||0,x.rank,rs(x.src,R)));
  return out}

const hm=t0=>{const [h,m]=S.cfg.start.split(':').map(Number),t=h*60+m+t0;return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const dur=min=>{const h=Math.floor(min/60),m=min%60;return h?`${h} h${m?' '+String(m).padStart(2,'0'):''}`:`${m} min`};
function describe(s){
  if(s.t)return tn(s.t);
  if(s.p)return `${s.r}${s.r===1?'er':'e'} de la poule ${s.p}`;
  const m=MM[s.w||s.l];
  if(m.auto){const real=[m.a,m.b].find(x=>!sideBye(x));return s.w&&real?describe(real):'Exempt'}
  return `${s.w?'Vainqueur':'Perdant'} du match ${m.no}`}
function disp(s){const r=rs(s,S.res);if(r==='BYE')return '<span class="ph">Exempt</span>';if(r)return esc(tn(r));return `<span class="ph">${esc(describe(s))}</span>`}

function drawCard(){

function cutViolations(){const r=BTC[S.bt],si=seedInfo(),bad=[];
  S.teams.forEach(t=>{const comp=S.cat==='D'?'FF':S.cat==='X'?'HF':(t.comp||'HH'),rk=[+t.ra,+t.rb];let ko=false;
    if(r.cut)rk.forEach((x,i)=>{const c=comp[i]==='H'?r.cut.M:r.cut.F;if(x>0&&x<c)ko=true});
    if(r.floor&&si.w[t.id]<r.floor)ko=true;
    if(ko)bad.push(t)});
  return bad}
function checks(){
  const r=BTC[S.bt],n=S.teams.length,C=+S.cfg.courts,out=[],mix=S.cat==='X';
  out.push({ok:C>=r.courts,t:`Terrains : ${C} (minimum ${S.bt} : ${r.courts})`});
  out.push({ok:n>=4,t:`Équipes : ${n} (4 équipes minimum pour homologuer l'épreuve)`});
  if(S.g&&S.g.mm){const a=S.g.mm.min,b=S.g.mm.max;
    out.push({ok:a>=3,t:`${a} match${a>1?'s':''} minimum par équipe (3 au minimum, matchs de classement obligatoires)`});
    out.push({ok:b<=r.maxDay,t:`${b} match${b>1?'s':''} au plus par équipe dans la journée (limite ${S.bt} : ${r.maxDay})`})}
  if(r.cut||r.floor){const bad=cutViolations();
    const lim=r.cut?`classement au mieux ${r.cut.M} pour les messieurs, ${r.cut.F} pour les dames`:`poids de paire d'au moins ${r.floor}`;
    out.push({ok:!bad.length,t:bad.length?`${bad.length} équipe${bad.length>1?'s':''} hors cut (${lim}) : ${bad.slice(0,3).map(t=>base(t.id)).join(', ')}${bad.length>3?'…':''}`:`Cut respecté (${lim})`})}
  if(S.cat==='M'&&r.cut){const nm=S.teams.filter(t=>(t.comp||'HH')!=='HH').length;out.push({ok:nm<=n/2,t:`Paires mixtes ou de dames : ${nm} (au plus la moitié de l'effectif)`})}
  if(S.bt==='BT500'&&n>=17)out.push({ok:false,t:'17 équipes ou plus : le BT500 doit se jouer sur 2 jours minimum'});
  const info=[`Juge-arbitre : ${r.jat}${r.kine?' ; kinésithérapeute '+r.kine:''}`,
    `Homologation : ${r.home} ; 31 € de droits (0 € pour les jeunes)`,
    `Inscriptions : clôture ${r.reg} ; sortie des listes ${r.order} ; ${r.wc}`,
    `Tirage au sort entre J-2 et J-1, tableaux publiés au plus tard à J-1 (J-0 pour un BT25 organisé le jour J)`,
    `Durée : ${r.days} ; prize money ${r.prize}`,
    `Balles : ${r.balls} ; ${r.zone} ; filet ${S.cat==='M'?(S.bt==='BT500'||S.bt==='BT1000'?'1,80 m':'1,70 m minimum, 1,80 m recommandé'):'1,70 m'}`,
    `Maximum ${r.maxDay} matchs par équipe et par jour ; une équipe ayant joué après 22 h ne peut être convoquée avant midi le lendemain`,
    `Le juge-arbitre saisit les résultats dans les 48 h suivant la fin du tournoi`];
  return {out,info}}
function viewFormat(){

  const rules=`<details class="card"><summary>Règles FFT appliquées</summary>
   <p class="hint">Vérifiées sur les règlements sportifs FFT 2027 (art. 210 à 214 et 225 à 232, règles du jeu) et sur le guide de la compétition beach tennis (janvier 2026) pour le cahier des charges de chaque catégorie.</p>

   <li>Formats : découverte (BT25 seulement), 3, 4, 5, 6. Double mixte : format 3 (BT25 : 3 ou découverte ; BT500 : 3 ou 4). Finale en format 4 obligatoire en BT100 et BT250 ; tableau principal en format 4 obligatoire en BT500 et BT1000 (hors mixte).</li>
   <li>Repos entre 2 parties : 1 h en format 4, 30 min pour les autres formats, 15 min après 3 matchs consécutifs en découverte.</li>
   <li>Cuts : BT25 messieurs 600 et dames 250 au mieux ; BT100 messieurs 200 et dames 150 ; BT250 : poids de paire d'au moins 120. Pas de double mixte en BT1000.</li></ul></details>`;

    <label class="lb" for="tdate">Date</label><input type="date" id="tdate" value="${S.date||''}">

    <label class="lb">Terrains disponibles (${S.bt} : ${BR.courts} minimum)</label>${seg('courts',[[1,'1'],[2,'2'],[3,'3'],[4,'4'],[6,'6'],[8,'8']],S.cfg.courts)}
    <label class="lb">Format de jeu FFT</label>${seg('form',[[0,'Découverte'],[3,'Format 3'],[4,'Format 4'],[5,'Format 5'],[6,'Format 6']],f,[0,3,4,5,6].filter(x=>!allowed.includes(x)))}
    <p class="hint">${FJ[f].d}.${mx?` Double mixte en ${S.bt} : ${BR.mix.map(FN).join(' ou ').toLowerCase()} uniquement.`:''}${!mx&&BR.fin==='fin4'?' La finale se joue obligatoirement en format 4.':''}${!mx&&BR.fin==='main4'?' Le tableau principal se joue obligatoirement en format 4.':''} Les matchs de classement peuvent se jouer en format court.</p>
    <label class="lb">Durée estimée d'un match (minutes)</label><div class="three">${used.map(u=>`<div><label for="dd${u}">${FN(u)}</label><input id="dd${u}" inputmode="numeric" value="${S.cfg.dur[u]}"></div>`).join('')}</div>

  if(RO()||S.g){
    const real=G?G.matches.filter(m=>!m.auto):[],last=Math.max(0,...real.map(m=>m.t1||0)),done=real.filter(m=>S.res[m.id]).length;
    return `${S.g?`<section class="card"><h2>${FMT[G.fmt].t}</h2><p class="hint">${C.n} · ${real.length} matchs · ${done} joué${done>1?'s':''} · fin prévue vers ${hm(last)}</p>
      ${RO()?'':`<div class="btnrow"><button class="btn pri" data-act="reschedule">Recalculer la programmation</button>${G.fmt==='tmc'&&!Object.keys(S.res).length?'<button class="btn" data-act="redraw">Refaire le tirage</button>':''}
      <button class="btn ${UI.confirm==='reset'?'warn':''}" data-act="reset">${UI.confirm==='reset'?'Confirmer : tout effacer sauf les équipes':'Repartir de zéro'}</button></div>
      <p class="hint">Après un changement de terrains, de durée ou de repos, recalcule la programmation : les matchs déjà joués ne bougent pas.</p>`}</section>${drawCard()}`:''}${RO()?'':settings}${rules}`}
  if(n<4)return `${settings}${empty('Il faut au moins 4 équipes','Ajoute des équipes pour voir les formats possibles.',`<div class="btnrow"><button class="btn pri" data-act="tab" data-v="teams">Aller aux équipes</button></div>`)}${rules}`;
  const props=proposals(),sel=props.some(p=>p.f===S.cfg.fmt)?S.cfg.fmt:props[0].f;

  ${props.map(p=>`<button class="fmt ${p.f===sel?'on':''}" data-act="pick" data-v="${p.f}"><div class="top"><b>${FMT[p.f].t}</b><span class="bd">${p.rec?'<span class="badge">Conseillé</span>':''}<span class="badge ${p.ok?'ok':'warn'}">${p.ok?'Conforme FFT':'Hors minimum FFT'}</span></span></div><p>${FMT[p.f].d}</p>${p.info?`<p class="why">${p.info}</p>`:''}${p.ok?'':'<p>La FFT impose au moins 3 matchs à chaque paire : ce format ne le garantit pas.</p>'}
  <dl><div><dt>Matchs</dt><dd>${p.matches}</dd></div><div><dt>Durée estimée</dt><dd>${dur(p.min)}</dd></div><div><dt>Matchs par équipe</dt><dd>${p.mg}${p.mx>p.mg?' à '+p.mx:' min.'}</dd></div></dl></button>`).join('')}

function viewMatches(){
  if(!S.g)return empty('Aucun tournoi généré','Choisis un format pour créer les matchs et la programmation.',`<div class="btnrow"><button class="btn pri" data-act="tab" data-v="format">Choisir le format</button></div>`);

  const chip=(v,l)=>`<button data-act="filter" data-v="${v}" aria-pressed="${UI.filter===v}">${l}</button>`;

function brHtml(b){
  const ms=G.matches.filter(m=>m.bk===b.bk);if(!ms.length)return '';
  const path=ms.filter(m=>/^W*$/.test(m.gp)),rounds=[...new Set(path.map(m=>m.rd))].sort((x,y)=>x-y),cols=rounds.map(r=>path.filter(m=>m.rd===r));
  const BH=58,SL=BH+24,CW=200,GAP=38,TOP=24,H=cols[0].length*SL,Wd=cols.length*CW+(cols.length-1)*GAP;
  const pos=(ri,j)=>({x:ri*(CW+GAP),cy:TOP+(j+.5)*SL*Math.pow(2,ri)});

  down(id){const o=seedInfo().order,i=o.indexOf(id);if(i<o.length-1)ACT.swap(id,o[i+1])},
  swap(x,y){const i=S.teams.findIndex(t=>t.id===x),j=S.teams.findIndex(t=>t.id===y);[S.teams[i],S.teams[j]]=[S.teams[j],S.teams[i]];save();render()},
  shuffle(){S.teams=shuf(S.teams);save();render();toast('Égalités départagées au sort.')},
  demo(_,v){const n=+v||8,nm=['Martin','Leroy','Dupont','Garcia','Bernard','Petit','Moreau','Simon','Laurent','Michel','Roux','Fournier','Girard','Lambert','Faure','Blanc','Andre','Mercier','Dupuis','Lopez','Fontaine','Rousseau','Vincent','Muller','Lefevre','Morel','Chevalier','Robin','Masson','Henry','Perrin','Clement','Boyer','Gauthier','Barbier','Arnaud','Marchand','Dufour','Blanchard','Brun','Giraud','Joly','Riviere','Lucas','Brunet','Gaillard','Barre','Roche','Renard','Schmitt','Leroux','Colin','Vidal','Caron','Picard','Roger','Fabre','Aubert','Lemoine','Renaud','Dumont','Marie','Lemaire'];
    S.teams=Array.from({length:n},(_,i)=>({id:uid(),a:nm[(2*i)%nm.length],b:nm[(2*i+1)%nm.length],ra:i<n*0.75?250+i*23:0,rb:i<n*0.75?325+i*29:0,la:'',lb:'',dr:Math.random(),comp:S.cat==='D'?'FF':S.cat==='X'?'HF':'HH'}));
    S.cfg.fmt=null;save();render()},
  cfg(k,v){if(k==='form'){const r=BTC[S.bt],al=S.cat==='X'?r.mix:r.forms;if(!al.includes(+v))return toast(S.cat==='X'?`Double mixte en ${S.bt} : ${r.mix.map(FN).join(' ou ').toLowerCase()} uniquement.`:`${FN(+v)} non autorisé en ${S.bt}.`)}S.cfg[k]=+v;save();render()},
  pick(_,v){S.cfg.fmt=v;save();render()},
  generate(k){const si=seedInfo(),ids=si.order;if(ids.length<4)return;const props=proposals(),f=props.some(p=>p.f===S.cfg.fmt)?S.cfg.fmt:props[0].f;
    const g=build(f,ids,si);g.mm=withG(g,()=>minGames(ids,25));setG(g);S.g=g;S.res={};schedule({});save();if(k!=='keep'){UI.tab='matches';scrollTo(0,0)}UI.filter='all';render()},
  redraw(){if(Object.keys(S.res).length)return toast('Tirage figé : des résultats sont déjà saisis.');S.cfg.fmt=G.fmt;ACT.generate('keep');toast('Nouveau tirage effectué.')},
  reschedule(){schedule(S.res);save();render();toast('Programmation recalculée.')},
  reset(){if(UI.confirm!=='reset'){UI.confirm='reset';render();return}
    S.g=null;S.res={};setG(null);UI.confirm=null;save();render();toast('Tournoi réinitialisé. Les équipes sont conservées.')},
  open(id){const m=MM[id],a=rs(m.a,S.res),b=rs(m.b,S.res);
    if(!a||!b)return toast('Les équipes de ce match ne sont pas encore connues.');
    UI.sheet=id;render();const i=$('#i-0-a');if(i&&!RO())i.focus()},
  closeSheet(){UI.sheet=null;UI.edit=null;UI.lib=false;UI.confirm=null;render()},
  editTeam(id){if(S.g)return;UI.edit=id;render();const i=$('#e-a');if(i)i.focus()},
  saveTeam(){const t=S.teams.find(x=>x.id===UI.edit),v=k=>$('#e-'+k).value.trim(),err=m=>{$('#err').textContent=m};
    const a=v('a'),b=v('b'),la=normL(v('la')),lb=normL(v('lb')),ra=parseInt(v('ra'),10)||0,rb=parseInt(v('rb'),10)||0;
    if(!a||!b)return err('Saisis les deux joueurs.');
    if(!okL(la)||!okL(lb))return err('Licence invalide : chiffres suivis d\'une lettre, par exemple 1234567A.');
    if(la&&la===lb)return err('Les deux joueurs ont le même numéro de licence.');
    const dup=S.teams.find(x=>x.id!==t.id&&[x.la,x.lb].some(y=>y&&(y===la||y===lb)));if(dup)return err('Ce numéro de licence est déjà inscrit : '+base(dup.id)+'.');
    Object.assign(t,{a,b,la,lb,ra,rb});if($('#e-cmp'))t.comp=$('#e-cmp').value;save();UI.edit=null;render();toast('Équipe mise à jour.')},
  saveScore(){const mid=UI.sheet,m=MM[mid],f=fOfM(m),{n,tb}=FJ[f],err=t=>{$('#err').textContent=t};
    const v=(s,t)=>{const x=$('#i-'+s+'-'+t).value.trim();return x===''?null:parseInt(x,10)};
    const sets=[];let wa=0,wb=0;
    if(f===0){const a=v(0,'a'),b=v(0,'b');
      if(a==null||b==null||isNaN(a)||isNaN(b))return err('Renseigne le score des deux équipes.');
      if(!validSet(a,b,0))return err('Format découverte : 1 set de 12 points, le score du vainqueur est de 12.');
      sets.push([a,b]);a>b?wa++:wb++}
    else{
      for(let s=0;s<2;s++){const a=v(s,'a'),b=v(s,'b');
        if(a==null||b==null||isNaN(a)||isNaN(b))return err(`Renseigne le score du set ${s+1} pour les deux équipes.`);
        if(!validSet(a,b,f))return err(`Set ${s+1} : score impossible en format ${f}. ${tb===n?`Il faut ${n} jeux avec 2 d'écart, ou ${n+1}-${n-1} / ${n+1}-${n}.`:`Il faut ${n} jeux, l'adversaire en a ${n-1} au maximum.`}`);
        sets.push([a,b]);a>b?wa++:wb++}
      const a3=v(2,'a'),b3=v(2,'b');
      if(wa===1&&wb===1){if(a3==null||b3==null||isNaN(a3)||isNaN(b3))return err('Un set partout : renseigne le super jeu décisif.');
        if(Math.max(a3,b3)<10||Math.abs(a3-b3)<2)return err('Super jeu décisif : 10 points minimum avec 2 points d\'écart.');
        sets.push([a3,b3]);a3>b3?wa++:wb++}
      else if(a3!=null||b3!=null)return err('Le match est terminé en 2 sets : pas de super jeu décisif.')}
    const w=wa>wb?'a':'b';
    if(blocked(mid,w))return err('Impossible : des matchs suivants dépendent déjà de ce résultat. Efface d\'abord leurs scores.');
    S.res[mid]={sets,w};save();UI.sheet=null;render();toast('Résultat enregistré.')},
  wo(_,side){const mid=UI.sheet,m=MM[mid],f=fOfM(m),w=side==='a'?'b':'a';
    if(blocked(mid,w))return $('#err').textContent='Impossible : des matchs suivants dépendent déjà de ce résultat. Efface d\'abord leurs scores.';
    S.res[mid]={sets:forfait(f).map(s=>w==='a'?s:[s[1],s[0]]),w,wo:side};save();UI.sheet=null;render();toast('Forfait enregistré (score forfaitaire).')},
  clearScore(){const mid=UI.sheet;if(blocked(mid,null))return $('#err').textContent='Impossible : des matchs suivants dépendent déjà de ce résultat. Efface d\'abord leurs scores.';
    delete S.res[mid];save();UI.sheet=null;render();toast('Résultat effacé.')},
  async share(){const t=shareText();try{if(navigator.share){await navigator.share({title:S.name,text:t});return}}catch(e){if(e&&e.name==='AbortError')return}ACT.copy()},
  copy(){const t=shareText(),ok=()=>toast('Texte copié.');
    const fb=()=>{const r=document.createRange();r.selectNodeContents($('#shareTxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');ok()}catch(e){toast('Sélectionne le texte pour le copier.')}};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.dataset.self&&e.target!==el)return;
  const a=el.dataset.act;if(MUT.has(a)&&RO())return toast('Tournoi archivé : consultation seule.');
  const f=ACT[a];if(f)f(el.dataset.id,el.dataset.v)});
document.addEventListener('change',e=>{const id=e.target.id;
  if(RO()&&(['tname','tdate','tstart','ncrank'].includes(id)||/^dd[03456]$/.test(id))){render();return toast('Tournoi archivé : consultation seule.')}
  if(id==='tname'){S.name=e.target.value.trim()||'Nouveau tournoi';save();$('#ttl').textContent=S.name}
  if(id==='tdate'){S.date=e.target.value;save();$('#cat').textContent=S.bt+' · '+CAT[S.cat].n+(S.date?' · '+fmtD(S.date):'')}
  if(id==='tstart'&&e.target.value){S.cfg.start=e.target.value;save()}
  if(/^dd[03456]$/.test(id)){const x=parseInt(e.target.value,10);if(x>=5&&x<=120){S.cfg.dur[+id[2]]=x;save()}else toast('Durée comprise entre 5 et 120 minutes.');render()}
  if(id==='ncrank'){S.cfg.nc=parseInt(e.target.value,10)||0;save();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='j1')$('#j2').focus();else if(e.target.id==='j2')ACT.addTeam()}
  if(e.key==='Escape'&&(UI.sheet||UI.edit||UI.lib))ACT.closeSheet()});

useCur();
if(S.g)UI.tab='matches';
render();
</script>
</body>
